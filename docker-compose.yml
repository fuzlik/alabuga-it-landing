services:
  postgres:
    image: postgres:16-alpine
    container_name: alabuga-it-postgres
    environment:
      POSTGRES_USER: alabuga
      POSTGRES_PASSWORD: alabuga
      POSTGRES_DB: alabuga_it
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alabuga -d alabuga_it"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
